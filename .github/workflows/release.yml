name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Generate Release Tag
        id: release_tag
        run: |
          # Fetch all tags from remote
          git fetch --tags

          # Get the latest build number from existing releases
          LATEST_BUILD=0

          # Check if there are existing build tags and find the highest number
          if git tag | grep -E "^build-[0-9]+$" > /dev/null; then
            LATEST_BUILD=$(git tag | grep -E "^build-[0-9]+$" | sed 's/build-//' | sort -n | tail -1)
          fi

          echo "All tags:"
          git tag
          echo "Build tags found:"
          git tag | grep -E "^build-[0-9]+$" || echo "No build tags found"
          echo "Latest build number found: $LATEST_BUILD"

          # Increment the build number
          NEW_BUILD=$((LATEST_BUILD + 1))

          echo "tag=build-$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "build_nr=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "Generated tag: build-$NEW_BUILD"
          echo "Previous highest build: $LATEST_BUILD"
          echo "New build number: $NEW_BUILD"

      - name: Build with Gradle
        env:
          BUILD_NUMBER: ${{ steps.release_tag.outputs.build_nr }}
        run: ./gradlew build

      - name: Prepare Release Jars
        run: |
          FAT_JAR=$(ls proxy/build/libs/velocity-proxy-*-all.jar)
          FAT_VERSION=$(echo "$FAT_JAR" | sed 's|proxy/build/libs/velocity-proxy-||' | sed 's|-all\.jar||')
          cp "$FAT_JAR" "proxy/build/libs/flume-fatjar-$FAT_VERSION-${{ steps.release_tag.outputs.build_nr }}.jar"

          BOOT_JAR=$(ls bootstrap/build/libs/velocity-bootstrap-*.jar | grep -v -- '-sources\.jar')
          BOOT_VERSION=$(echo "$BOOT_JAR" | sed 's|bootstrap/build/libs/velocity-bootstrap-||' | sed 's|\.jar||')
          cp "$BOOT_JAR" "bootstrap/build/libs/flume-$BOOT_VERSION-${{ steps.release_tag.outputs.build_nr }}.jar"

      - name: Upload as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Flume Build #${{ steps.release_tag.outputs.build_nr }}"
          tag_name: "${{ steps.release_tag.outputs.tag }}"
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## Which jar should I download?

            **Recommended — `flume-<version>-<build>.jar` (bootstrap jar)**
            This is the standard bootstrap jar. It downloads required dependencies only once on initial launch, keeping the download small.

            **Fallback — `flume-fatjar-<version>-<build>.jar`**
            Self-contained fat jar containing all dependencies. Only use this if the bootstrap jar has networking or dependency issues in your environment.
          files: |
            proxy/build/libs/flume-fatjar-*-${{ steps.release_tag.outputs.build_nr }}.jar
            bootstrap/build/libs/flume-*-${{ steps.release_tag.outputs.build_nr }}.jar
